[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aoseye"
version = "0.1.0"
description = "Evidence-oriented Android security analysis with a local JEB backend"
readme = "PACKAGE_README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "PyYAML>=6,<7", "defusedxml>=0.7,<1", "cryptography>=48,<49"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "psutil>=7,<8"]

[project.scripts]
aoseye = "analyzer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analyzer = ["gui/qml/*.qml", "backends/jeb/scripts/*.py", "core/rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["jeb: integration requiring a licensed local JEB installation"]
